services:
  postgres:
    image: postgres:17
    container_name: job-agent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: job_agent
      POSTGRES_USER: job_agent_user
      POSTGRES_PASSWORD: job_agent_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: